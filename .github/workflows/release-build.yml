name: Build release bundles

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v1.0.0)
        required: true
        default: v1.0.0

jobs:
  build:
    name: Build ${{ matrix.name }} bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    env:
      VERSION: ${{ github.ref_name || github.event.inputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Build app
        run: bun run build

      - name: Package Linux release
        if: matrix.name == 'linux'
        shell: bash
        run: |
          mkdir -p release
          tar -czf "release/myDocAnizer-Desktop-${VERSION}-linux-x64.tar.gz" -C dist .

      - name: Package macOS release
        if: matrix.name == 'macos'
        shell: bash
        run: |
          mkdir -p release
          cd dist
          zip -r "../release/myDocAnizer-Desktop-${VERSION}-macos-universal.zip" .
          cd ..

      - name: Package Windows release
        if: matrix.name == 'windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path ".\dist\*" -DestinationPath ".\release\myDocAnizer-Desktop-${env:VERSION}-windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: myDocAnizer-Desktop-${{ matrix.name }}
          path: release/
          retention-days: 30

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p final-release
          find release-artifacts -type f -exec cp {} final-release/ \;
          ls -lh final-release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            final-release/*
          generate_release_notes: true
