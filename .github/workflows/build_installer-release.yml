name: Build release installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v1.0.0)
        required: true
        default: v1.0.0

jobs:
  build-and-release:
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Frontend Setup (Bun)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # 2. System-Abhängigkeiten für Linux (wichtig für das Desktop-Fenster)
      - name: Install Linux UI dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # 3. Backend Setup (Rust)
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # 4. Installer bauen & direkt als GitHub Release veröffentlichen
      # Generiert .msi/.exe (Windows), .dmg (macOS) und .AppImage/.deb (Linux)
      - name: Build Installers & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name || github.event.inputs.version }}
          releaseName: 'myDocAnizer Desktop ${{ github.ref_name || github.event.inputs.version }}'
          releaseBody: 'Offizielle Desktop-Installer für Windows, macOS und Linux.'
          releaseDraft: false
          prerelease: false
